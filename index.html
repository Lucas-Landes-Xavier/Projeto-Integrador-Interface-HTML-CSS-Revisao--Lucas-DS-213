<!DOCTYPE html>
<html lang="en">
<!-- Declara que este é um documento HTML5 e que o idioma da página é inglês -->

<head>
    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres para UTF-8, garantindo que acentos e símbolos funcionem -->

    <meta name="viewport" content="width=device-width,  initial-scale=1.0">
    <!-- Configura a página para ser responsiva em dispositivos móveis -->

    <title>Exemplo Exercício Desvio Condicional - Validação Número</title>
    <!-- Define o título da aba do navegador -->

    <link rel="stylesheet" href="styles.css">
    <!-- Linka o arquivo CSS externo para estilizar a página -->

    <script src="script.js"></script>
    <!-- Linka o arquivo JavaScript externo onde está a função validarNumero() -->
</head>

<body>
    <div class="container">
        <!-- Um container para centralizar e organizar os elementos da página -->

        <h1 id="titulo">Validação de Números</h1>
        <!-- Título principal da página -->

        <input type="number" id="numero" placeholder="Digite um número">
        <!-- Campo para o usuário digitar um número -->
        <!-- O atributo "placeholder" mostra uma dica dentro do campo -->

        <button onclick="validarNumero()">Validar</button>
        <!-- Botão que chama a função validarNumero() ao ser clicado -->

        <p id="mensagem"></p>
        <!-- Parágrafo onde será exibida a mensagem após a validação -->
    </div>
</body>

</html>
